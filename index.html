    <!-- ─────────────────────────────────────────────────────────────────
         WHY THE SOCIAL TAGS ARE FIRST AND THIS NOTE IS LAST.

         LinkedIn fetches this page with a Range header; the CDN answers 206
         Partial Content. LinkedIn parses what it received and stops. Measured
         30 September 2026: it stopped at about byte 1300.

         Previously the SEO block and a long comment sat first, so the image
         tag landed at byte 1515 - past the cut. LinkedIn never saw an image,
         never saw the page type either, and guessed "Article". Title and
         description came through only because they happened to sit above the
         cut. The image itself was never the problem: it serves 200, image/png,
         1200x630.

         So nothing verbose goes above the tags. Not comments, not keywords,
         not a long description. This note is down here for that reason - move
         it up and you break the link preview again.

         Crawlers do not run JavaScript, so these tags ARE the preview. If the
         homepage copy changes, change them in the same commit.
    ───────────────────────────────────────────────────────────────────── -->
