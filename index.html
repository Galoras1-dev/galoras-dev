    <!-- ─────────────────────────────────────────────────────────────────
         SOCIAL TAGS. WHAT WAS ACTUALLY WRONG, 30 SEPTEMBER 2026.

         The LinkedIn share card rendered with a title and no picture. Ruled
         out, with evidence, before changing this: the tags (live and correct),
         the image (200, image/png, 1200x630, 104KB, renders), LinkedIn's cache
         (a never-scraped URL failed identically), truncation (og:type sat well
         inside what LinkedIn received and still came back wrong), robots.txt
         (allows everything), and the 206 Partial Content response - Supabase's
         CDN does the same thing, so it cannot be disqualifying.

         What was left was the format. LinkedIn is markedly more reliable with
         JPEG than PNG for og:image. The file is now a baseline JPEG at a NEW
         filename, which also sidesteps any negative result LinkedIn had cached
         against the old URL.

         Tags stay near the top of the head. Crawlers do not run JavaScript, so
         these tags ARE the preview. If the homepage copy changes, change them
         in the same commit.

         galoras-og.png is left in place - other things may reference it.
    ───────────────────────────────────────────────────────────────────── -->
