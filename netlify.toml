[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_STRIPE_PUBLISHABLE_KEY"

# Short links for the UAT feedback forms.
# These MUST stay above the SPA catch-all below - Netlify matches in order,
# and "/*" would otherwise swallow them and serve index.html instead.
[[redirects]]
  from = "/checkin"
  to = "https://forms.cloud.microsoft/r/qPqKrAHdxL"
  status = 302

[[redirects]]
  from = "/feedback-coach"
  to = "https://forms.cloud.microsoft/r/NgXwe0MCwi"
  status = 302

[[redirects]]
  from = "/feedback-coachee"
  to = "https://forms.cloud.microsoft/r/HGb991uQBz"
  status = 302

# SPA routing - all routes fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache index.html with no-cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Long-term cache for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images cache for 1 year
[[headers]]
  for = "/public/coaches/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

# SVG files
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"
