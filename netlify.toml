[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_STRIPE_PUBLISHABLE_KEY"

# Short links for the UAT feedback forms.
# These MUST stay above the SPA catch-all below - Netlify matches in order,
# and "/*" would otherwise swallow them and serve index.html instead.
[[redirects]]
  from = "/checkin"
  to = "https://forms.cloud.microsoft/r/qPqKrAHdxL"
  status = 302

[[redirects]]
  from = "/feedback-coach"
  to = "https://forms.cloud.microsoft/r/NgXwe0MCwi"
  status = 302

[[redirects]]
  from = "/feedback-coachee"
  to = "https://forms.cloud.microsoft/r/HGb991uQBz"
  status = 302

# SPA routing - all routes fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera and microphone must NOT be listed as () here. That value switches
    # them off for every page AND every iframe inside it, including the Whereby
    # session room. Chrome enforces this header; Safari ignores it — which is
    # exactly why sessions 1 and 2 of the pilot only worked in Safari.
    # Fixed 6 October 2026. Do not restore.
    Permissions-Policy = "geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── LinkedIn and the 206 ──────────────────────────────────────────────────
# Netlify honours a Range header and answers 206 Partial Content. LinkedIn's
# crawler sends one, and its Post Inspector logs "1 206 Success" against
# galoras.com. It reads og:title and og:description - both of which sit AFTER
# og:image in the document - so it sees the image tag and then rejects the
# image itself. Confirmed 30 September 2026: a URL LinkedIn had never scraped
# before failed identically, so this is not a cached miss.
#
# Accept-Ranges: none tells clients this resource is not rangeable. Videos are
# served from Supabase storage, not from this origin, so nothing here needs
# range requests.
[[headers]]
  for = "/galoras-og.png"
  [headers.values]
    Accept-Ranges = "none"
    Cache-Control = "public, max-age=3600"
    Content-Type = "image/png"

[[headers]]
  for = "/"
  [headers.values]
    Accept-Ranges = "none"

# Cache index.html with no-cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Long-term cache for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images cache for 1 year
[[headers]]
  for = "/public/coaches/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

# SVG files
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"
