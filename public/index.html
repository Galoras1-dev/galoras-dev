<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <!--
      THESE TAGS ARE WHAT LINKEDIN, GOOGLE, X, WHATSAPP AND SLACK ACTUALLY READ.

      Their crawlers do not run JavaScript, so they never see the React-rendered
      page. Whatever is in this file IS the link preview, no matter what the
      homepage says. Until 29 September 2026 this file still read "Elite
      Performance Coaching Exchange" and "unlock your potential" - the exact
      phrase the brand had just banned - and og:image pointed at a file that did
      not exist, so every share showed a broken card.

      If the homepage copy changes, change these in the same commit.

      Absolute URLs on og:image and twitter:image are deliberate. LinkedIn is
      unreliable with relative paths and will silently drop the image.
    -->
    <title>Galoras | AI that enables human connection</title>
    <meta name="description" content="Find the right coach. Meet in one place. Keep the work moving between sessions. Galoras is a coaching platform built for the whole relationship, not just the introduction. Opening January 2027." />
    <meta name="keywords" content="executive coaching, coaching platform, leadership coaching, coach matching, coaching software, business coaching, performance coaching" />
    <meta name="author" content="Galoras" />
    
    <!-- Open Graph -->
    <meta property="og:site_name" content="Galoras" />
    <meta property="og:title" content="Do More. Do It Now. | Galoras" />
    <meta property="og:description" content="Find the right coach. Meet in one place. Keep the work moving between sessions. Opening January 2027." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://galoras.com" />
    <meta property="og:image" content="https://galoras.com/galoras-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Galoras — Do More. Do It Now. AI that enables human connection." />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Do More. Do It Now. | Galoras" />
    <meta name="twitter:description" content="Find the right coach. Meet in one place. Keep the work moving between sessions. Opening January 2027." />
    <meta name="twitter:image" content="https://galoras.com/galoras-og.png" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://galoras.com" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
